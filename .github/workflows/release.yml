name: "publish"

on:
  push:
    branches:
      - release
      - release-demo
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel to publish
        required: true
        type: choice
        options:
          - release
          - release-demo

jobs:
  resolve-channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.value }}
      tauri_config: ${{ steps.channel.outputs.tauri_config }}
    steps:
      - id: channel
        shell: bash
        run: |
          channel="${{ inputs.channel || github.ref_name }}"
          if [[ "$channel" != "release" && "$channel" != "release-demo" ]]; then
            echo "Unsupported release channel: $channel" >&2
            exit 1
          fi
          echo "value=$channel" >> "$GITHUB_OUTPUT"
          if [[ "$channel" == "release-demo" ]]; then
            echo "tauri_config=--config src-tauri/tauri.demo.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "tauri_config=" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: resolve-channel
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.resolve-channel.outputs.channel }}
          releaseName: "JLJ ${{ needs.resolve-channel.outputs.channel }}"
          releaseBody: "Automated ${{ needs.resolve-channel.outputs.channel }} channel release."
          releaseDraft: false
          prerelease: ${{ needs.resolve-channel.outputs.channel == 'release-demo' }}
          args: ${{ matrix.args }} ${{ needs.resolve-channel.outputs.tauri_config }}
