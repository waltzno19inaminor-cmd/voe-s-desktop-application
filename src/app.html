<!DOCTYPE html>
<html>
  <head>
    <script>
      (function () {
        try {
          const isDark = localStorage.getItem('dark') === 'true'
          if (isDark) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="__nuxt"></div>
  </body>
</html>
